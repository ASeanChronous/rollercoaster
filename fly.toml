# Fly.io config. Set `app` to your own app name (it must be unique on Fly).
app = "rollercoaster-outages"
primary_region = "dfw"

[build]
  # Uncomment and set for production map tiles (see README "Deploy").
  # [build.args]
  #   NEXT_PUBLIC_MAP_TILE_URL = "https://api.maptiler.com/maps/streets-v2/256/{z}/{x}/{y}.png?key=YOUR_KEY"
  #   NEXT_PUBLIC_MAP_TILE_ATTRIBUTION = "&copy; MapTiler &copy; OpenStreetMap contributors"

[env]
  DEMO_MODE = "true"
  POLL_INTERVAL_SECONDS = "60"

[http_service]
  internal_port = 3000
  force_https = true
  # The engine keeps state in memory and runs on a timer, so the machine
  # must stay up, and there must be exactly one (see README).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 800

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
