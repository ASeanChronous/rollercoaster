name: iOS Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run static analysis
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build iOS App (.app / unsigned)
        working-directory: mobile
        run: flutter build ios --no-codesign --release

      - name: Package Payload into unsigned IPA
        working-directory: mobile
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Rollercoaster-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rollercoaster-iOS-unsigned
          path: mobile/build/ios/iphoneos/Rollercoaster-unsigned.ipa
          retention-days: 14
