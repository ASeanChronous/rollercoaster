name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build Number (leave empty to auto-increment from GitHub Run Number)'
        required: false
        default: ''

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run static analysis
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          # Validate required secrets are present
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is missing or empty! Please add it in Repo Settings -> Secrets."
            exit 1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "::error::P12_PASSWORD secret is missing or empty! Please add it in Repo Settings -> Secrets."
            exit 1
          fi
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 secret is missing or empty! Please add it in Repo Settings -> Secrets."
            exit 1
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::KEYCHAIN_PASSWORD secret is missing or empty! Please add it in Repo Settings -> Secrets."
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode base64 secrets reliably using python3
          python3 -c "import os, base64; open(os.environ['CERTIFICATE_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64']))"
          python3 -c "import os, base64; open(os.environ['PP_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64']))"

          echo "Certificate size: $(wc -c < $CERTIFICATE_PATH) bytes"
          echo "Profile size: $(wc -c < $PP_PATH) bytes"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate to temporary keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          
          # Configure keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Extract UUID and install provisioning profile
          PROFILE_UUID=$(security cms -D -i "$PP_PATH" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "0a347334-94fb-4e5f-a85c-6d0fd5cf4859")
          echo "Installing profile with UUID: $PROFILE_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/Rollercoaster_AppStore_Profile.mobileprovision

      - name: Calculate Build Number
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "build_number=${{ github.event.inputs.build_number }}" >> $GITHUB_OUTPUT
          else
            echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Signed iOS IPA
        working-directory: mobile
        run: |
          flutter build ipa --release \
            --build-name=${{ github.event.inputs.build_name }} \
            --build-number=${{ steps.versioning.outputs.build_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight (App Store Connect)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_BASE64" ]; then
            echo "::error::One or more App Store Connect API secrets (KEY_ID, ISSUER_ID, KEY_BASE64) are missing!"
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          python3 -c "import os, base64; open(os.path.expanduser('~/.appstoreconnect/private_keys/AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8'), 'wb').write(base64.b64decode(os.environ['APP_STORE_CONNECT_KEY_BASE64']))"

          xcrun altool --upload-app \
            -f mobile/build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_KEY_ISSUER_ID"

      - name: Upload IPA Artifact (for backup)
        uses: actions/upload-artifact@v4
        with:
          name: Rollercoaster-Release-IPA
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Clean up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
